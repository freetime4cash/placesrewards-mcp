name: Revenue Engine CI

on:
  pull_request:
    paths:
      - 'revenue-engine/**'
      - 'package.json'
      - '.github/workflows/revenue-engine.yml'
  push:
    branches:
      - revenue-engine-runtime
    paths:
      - 'revenue-engine/**'
      - 'package.json'
      - '.github/workflows/revenue-engine.yml'

permissions:
  contents: read

jobs:
  test-revenue-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run isolated Revenue Engine tests
        run: npm run test:revenue
